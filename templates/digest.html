<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 日报 - {{DATE_ZH}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Noto+Sans+SC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#29231c;--ink2:#4a4035;--ink3:#7e7468;--ink4:#aaa195;
  --paper:#f7f1e7;--paper2:#eee5d7;--paper3:#ddd0bc;--white:#fffdf8;
  --rule:rgba(86,70,48,.16);--rule-mid:rgba(86,70,48,.26);--rule-dark:rgba(86,70,48,.42);
  --red:#b65a43;--red-tint:rgba(182,90,67,.10);
  --blue:#4b6f8f;--blue-tint:rgba(75,111,143,.10);
  --green:#667d55;--green-tint:rgba(102,125,85,.11);
  --amber:#a87935;--amber-tint:rgba(168,121,53,.12);
  --purple:#766a9c;--purple-tint:rgba(118,106,156,.10);
  --sel:#fff5d8;--sel-bdr:#c99b45;--insight:#f2eadc;--insight-bdr:#dccfb9;
  --font:'Noto Sans SC','PingFang SC',sans-serif;
  --display:'Playfair Display',Georgia,serif;
  --mono:'Space Mono','Courier New',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{min-height:100vh;background:linear-gradient(90deg,rgba(126,92,55,.05) 0,rgba(126,92,55,0) 18%,rgba(126,92,55,0) 82%,rgba(126,92,55,.05) 100%),var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body::before,body::after{content:'';position:fixed;top:0;bottom:0;width:1px;background:rgba(86,70,48,.13);pointer-events:none}
body::before{left:calc(50% - 510px)}body::after{right:calc(50% - 510px)}
.page{max-width:920px;margin:0 auto;padding:0 1.65rem 6.5rem}
.mast{position:relative;padding:2.2rem 0 0;text-align:center;border-bottom:1px solid var(--rule-dark);margin-bottom:1.15rem}
.mast::before{content:'';position:absolute;left:12%;right:12%;top:1.05rem;height:1px;background:linear-gradient(90deg,transparent,var(--rule-mid),transparent)}
.mast-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:1.05rem;padding-bottom:.8rem;border-bottom:1px solid var(--rule)}
.mast-top-col{font-family:var(--mono);font-size:9px;color:var(--ink3);letter-spacing:0;text-transform:uppercase;line-height:1.75}
.mast-top-col:last-child{text-align:right}
.mast-name{font-family:var(--display);font-size:86px;font-weight:900;line-height:.95;color:var(--ink);margin-bottom:.45rem}
.mast-name span{font-style:italic;color:var(--red)}
.mast-tagline{font-family:var(--display);font-size:12px;font-style:italic;color:var(--ink3);letter-spacing:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:.48rem 0;margin:.55rem auto .8rem;max-width:760px}
.mast-pills{display:flex;align-items:center;justify-content:center;gap:.42rem;flex-wrap:wrap;padding-bottom:1.1rem}
.source-label,.src-pill{font-family:var(--mono);font-size:8.5px}
.source-label{color:var(--ink4);letter-spacing:0;text-transform:uppercase;margin-right:.2rem}
.src-pill{padding:3px 9px;border:1px solid var(--rule);color:var(--ink3);text-decoration:none;border-radius:999px;background:rgba(255,253,248,.42);transition:all .12s}
.src-pill:hover{border-color:var(--red);color:var(--red);background:var(--white)}
.filterbar{position:sticky;top:0;z-index:50;background:rgba(247,241,231,.96);backdrop-filter:blur(10px);padding:.85rem 0;margin-bottom:1.45rem;border-top:1px solid rgba(255,255,255,.5);border-bottom:1px solid var(--rule);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-btn{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:0;min-height:35px;padding:0 14px;border:1px solid var(--rule-mid);background:rgba(255,253,248,.66);color:var(--ink2);border-radius:999px;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:6px}
.filter-btn:hover{background:var(--white);border-color:var(--rule-dark)}
.filter-btn.active{background:var(--ink);color:var(--white);border-color:var(--ink);box-shadow:0 7px 18px rgba(41,35,28,.12)}
.filter-btn .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.filter-btn .ct{font-size:9px;opacity:.65}
.dot-news{background:var(--red)}.dot-app{background:var(--blue)}.dot-fund{background:var(--green)}.dot-research{background:var(--purple)}.dot-github{background:var(--amber)}
#clip{background:#2f2921;border-radius:8px;margin-bottom:1.45rem;overflow:hidden;box-shadow:0 14px 32px rgba(56,44,29,.10)}
#clip-hd{display:flex;align-items:center;gap:.7rem;padding:.68rem 1rem}
#clip-lbl{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0;text-transform:uppercase;color:rgba(255,255,255,.45);flex:1}
#clip-n{font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.35)}
#clip-btn{background:var(--red);color:#fff;border:0;border-radius:999px;padding:.42rem 1rem;font-family:var(--mono);font-size:10px;font-weight:700;cursor:pointer}
#clip-bd{padding:.6rem 1rem .8rem}
#clip-empty{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.28);font-style:italic}
#clip-ta{width:100%;border:1px solid rgba(255,255,255,.1);border-radius:2px;padding:.5rem .65rem;font-family:var(--mono);font-size:11px;line-height:1.75;color:rgba(255,255,255,.85);background:rgba(255,255,255,.05);resize:none;outline:0;display:none}
.status-panel{background:rgba(255,253,248,.74);border:1px solid var(--rule);border-radius:8px;margin-bottom:1.75rem;overflow:hidden}
.status-summary{display:flex;align-items:center;gap:.8rem;padding:.78rem 1rem;cursor:pointer;list-style:none}
.status-summary::-webkit-details-marker{display:none}
.status-title{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0;text-transform:uppercase}
.status-meta{font-family:var(--mono);font-size:8.5px;color:var(--ink4);flex:1}
.status-badge{font-family:var(--mono);font-size:9px;font-weight:700;padding:2px 7px;background:var(--green-tint);color:var(--green)}
.status-badge.previous_day,.status-badge.no_today{background:var(--amber-tint);color:var(--amber)}
.status-badge.fetch_failed,.status-badge.parse_failed{background:var(--red-tint);color:var(--red)}
.source-list{padding:0 1rem .75rem;border-top:1px solid var(--rule)}
.source-row{display:grid;grid-template-columns:1fr auto;gap:.25rem .9rem;padding:.55rem 0;border-bottom:1px solid var(--rule);font-size:11px}
.source-row:last-child{border-bottom:0}
.source-row span{font-family:var(--mono);font-size:9px;color:var(--ink3)}
.source-row.ok span{color:var(--green)}.source-row.warn span{color:var(--amber)}
.source-row.core-fail{background:var(--red-tint);margin:0 -.4rem;padding:.45rem .4rem}
.source-row.core-fail span{color:var(--red);font-weight:700}
.source-row small{grid-column:1/-1;color:var(--ink4)}
.core-tag{font-family:var(--mono);font-size:7px;color:var(--red);margin-left:.4rem;text-transform:uppercase}
.sec{position:relative;margin-top:2.25rem}.sec.hidden{display:none}
.sec::before{content:'';position:absolute;left:0;right:0;top:-1rem;height:1px;background:linear-gradient(90deg,var(--rule-mid),transparent 58%)}
.sec-hd{display:flex;align-items:baseline;gap:.85rem;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);padding:.62rem 0 .58rem;margin-bottom:1.05rem}
.sec-name{font-family:var(--display);font-size:20px;font-weight:700;font-style:italic}
.sec-name.red{color:var(--red)}.sec-name.blue{color:var(--blue)}.sec-name.green{color:var(--green)}.sec-name.purple{color:var(--purple)}.sec-name.amber{color:var(--amber)}
.sec-en{font-family:var(--mono);font-size:8px;text-transform:uppercase;letter-spacing:0;color:var(--ink4)}
.sec-ct{font-family:var(--mono);font-size:8px;color:var(--ink4);margin-left:auto}
.card{position:relative;background:rgba(255,253,248,.82);border:1px solid var(--rule);border-left:0;margin-bottom:.82rem;overflow:hidden;border-radius:8px;transition:border-color .15s,box-shadow .15s,background .15s}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rule-mid)}
.card:hover{border-color:var(--rule-dark);box-shadow:0 10px 24px rgba(66,52,34,.08);background:var(--white)}
.card.c-news::before{background:var(--red)}.card.c-app::before{background:var(--blue)}.card.c-fund::before{background:var(--green)}.card.c-research::before{background:var(--purple)}.card.c-github::before{background:var(--amber)}
.card.selected{background:var(--sel);border-color:var(--sel-bdr)}
.card.featured .card-headline{font-size:17px}
.card-row{display:flex}.card-chk{display:flex;align-items:flex-start;padding:1rem .65rem 1rem .9rem;flex-shrink:0}
.card-chk input{width:16px;height:16px;accent-color:var(--red);cursor:pointer;margin-top:3px}
.card-body-wrap{flex:1;min-width:0}
.card-lnk{display:block;text-decoration:none;color:inherit;padding:1rem 1.15rem 0 0;transition:background .12s}
.card-lnk:hover{background:rgba(238,229,215,.42)}
.card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:.42rem}
.card-headline{font-family:var(--display);font-size:15.8px;font-weight:700;color:var(--ink);line-height:1.5;flex:1}
.badge{font-family:var(--mono);font-size:8px;letter-spacing:0;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;flex-shrink:0;margin-top:3px;font-weight:700}
.b-news{background:var(--red-tint);color:var(--red)}.b-app{background:var(--blue-tint);color:var(--blue)}.b-fund{background:var(--green-tint);color:var(--green)}.b-research{background:var(--purple-tint);color:var(--purple)}.b-github{background:var(--amber-tint);color:var(--amber)}
.card-published{font-family:var(--mono);font-size:8.5px;color:var(--ink4);margin:-.05rem 0 .55rem;letter-spacing:0}
.card-text{font-size:13.5px;color:var(--ink2);line-height:1.9;padding:0 1.15rem .9rem 0}
.card-ft{display:flex;align-items:center;gap:6px;padding:.55rem 1.15rem .7rem 0;border-top:1px solid var(--rule)}
.card-src,.card-time{font-family:var(--mono);font-size:9px;color:var(--ink4)}
.card-orig{font-family:var(--mono);font-size:9px;color:var(--blue);text-decoration:none;margin-left:auto;opacity:.8}
.card-orig:hover{opacity:1;text-decoration:underline}
.insight{background:linear-gradient(90deg,rgba(255,253,248,.32),var(--insight));border-top:1px solid var(--insight-bdr);padding:.82rem 1rem .95rem .95rem}
.ins-lbl{font-family:var(--mono);font-size:8px;letter-spacing:0;text-transform:uppercase;color:var(--ink3);margin-bottom:.3rem;display:flex;align-items:center;gap:5px}
.ins-lbl::before{content:'';width:10px;height:1px;background:var(--ink3);opacity:.5}
.ins-txt{font-size:13px;color:var(--ink2);line-height:1.8}
.empty-section{background:rgba(255,253,248,.7);border:1px solid var(--rule);border-radius:8px;padding:1.1rem;font-family:var(--mono);font-size:10px;color:var(--ink4)}
.footer{margin-top:3rem;padding:1.1rem 0;border-top:1px solid var(--rule-dark);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
.ft-txt,.ft-lnk{font-family:var(--mono);font-size:9px}.ft-txt{color:var(--ink4)}.ft-links{display:flex;gap:.9rem}.ft-lnk{color:var(--red);text-decoration:none;opacity:.75}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fi .3s ease both}
@media(max-width:580px){
  body::before,body::after{display:none}
  .page{padding:0 .95rem 5rem}.mast-top{grid-template-columns:1fr 1fr}.mast-top-col:nth-child(2){display:none}.mast-name{font-size:42px}
  .filterbar{gap:5px}.filter-btn{font-size:10px;padding:0 10px;min-height:32px}
  .card-top{display:block}.badge{display:inline-block;margin:.35rem 0 0}.card-ft{align-items:flex-start;flex-wrap:wrap}.card-orig{margin-left:0;width:100%}
}
@media(min-width:581px) and (max-width:820px){
  .mast-name{font-size:62px}
}
</style>
</head>
<body>
<div class="page">
<header class="mast">
  <div class="mast-top">
    <div class="mast-top-col">{{DATE_ZH}}<br>每日出版</div>
    <div class="mast-top-col">精选 {{TOTAL}} 条 · 来源 {{SOURCE_COUNT}} 个</div>
    <div class="mast-top-col">更新 {{UPDATE_TIME}}<br>洛杉矶时间</div>
  </div>
  <div class="mast-name">AI <span>日报</span></div>
  <div class="mast-tagline">抓取可信 AI 信号 · Codex 中文解读 · 为正在把 AI 用进工作流的你而做</div>
  <div class="mast-pills"><span class="source-label">今日来源</span>{{SOURCE_PILLS}}</div>
</header>
<div class="filterbar" role="group" aria-label="板块筛选">{{FILTER_BUTTONS}}</div>
<div id="clip">
  <div id="clip-hd"><span id="clip-lbl">Clipboard</span><span id="clip-n">0 条已选</span><button id="clip-btn" type="button" onclick="copyClip()">一键复制</button></div>
  <div id="clip-bd"><div id="clip-empty">尚未选择条目</div><textarea id="clip-ta" readonly rows="1"></textarea></div>
</div>
{{STATUS_PANEL}}
{{SECTIONS}}
<div class="footer">
  <span class="ft-txt">AI 日报 · {{DATE_ZH}} · Codex 解读 · 固定链接每日自动更新</span>
  <div class="ft-links"><a href="https://github.com/TianyuLiu0829/ai-daily-digest" target="_blank" rel="noopener" class="ft-lnk">GitHub</a><a href="./" class="ft-lnk">固定链接</a></div>
</div>
</div>
<script>
var selected = {};
var activeFilter = 'all';
function hasClass(el,name){return (' '+el.className+' ').indexOf(' '+name+' ')!==-1}
function addClass(el,name){if(!hasClass(el,name)){el.className+=(el.className?' ':'')+name}}
function removeClass(el,name){el.className=(' '+el.className+' ').replace(' '+name+' ',' ').replace(/^\s+|\s+$/g,'')}
function applyFilter(){
  var sections=document.querySelectorAll('[data-section]');
  var i,show;
  for(i=0;i<sections.length;i++){
    show=activeFilter==='all'||sections[i].getAttribute('data-section')===activeFilter;
    if(show){removeClass(sections[i],'hidden')}else{addClass(sections[i],'hidden')}
  }
}
function bindFilters(){
  var buttons=document.querySelectorAll('[data-filter]');
  var i;
  for(i=0;i<buttons.length;i++){
    (function(button){
      button.onclick=function(){
        var j;
        activeFilter=button.getAttribute('data-filter');
        for(j=0;j<buttons.length;j++){removeClass(buttons[j],'active')}
        addClass(button,'active');
        applyFilter();
      };
    })(buttons[i]);
  }
}
function updateClipboard(){
  var ta=document.getElementById('clip-ta');
  var empty=document.getElementById('clip-empty');
  var count=document.getElementById('clip-n');
  var cards=document.querySelectorAll('[data-id]');
  var lines=[];
  var total=0;
  var i,id;
  for(i=0;i<cards.length;i++){
    id=cards[i].getAttribute('data-id');
    if(selected[id]){
      total++;
      lines.push(cards[i].getAttribute('data-title')||'');
      lines.push(cards[i].getAttribute('data-link')||'');
      lines.push('');
    }
  }
  count.innerHTML=String(total)+' 条已选';
  if(total===0){ta.style.display='none';empty.style.display='block';ta.value='';return}
  ta.value=lines.join('\n').replace(/\s+$/,'');
  ta.style.display='block';empty.style.display='none';
  ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight+4,200)+'px';
}
function copyClip(){
  var ta=document.getElementById('clip-ta');
  var button=document.getElementById('clip-btn');
  var old=button.innerHTML;
  function done(){button.innerHTML='已复制';setTimeout(function(){button.innerHTML=old},1600)}
  if(!ta.value){return}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done,function(){ta.select();document.execCommand('copy');done()})}
  else{ta.select();document.execCommand('copy');done()}
}
function bindCards(){
  var cards=document.querySelectorAll('[data-id]');
  var i;
  for(i=0;i<cards.length;i++){
    (function(card){
      var checkbox=card.querySelector('input[type=checkbox]');
      var id=card.getAttribute('data-id');
      if(!checkbox){return}
      checkbox.onchange=function(){
        if(checkbox.checked){selected[id]=true;addClass(card,'selected')}
        else{delete selected[id];removeClass(card,'selected')}
        updateClipboard();
      };
      checkbox.onclick=function(event){if(event&&event.stopPropagation){event.stopPropagation()}};
    })(cards[i]);
  }
}
bindFilters();
bindCards();
</script>
</body>
</html>
